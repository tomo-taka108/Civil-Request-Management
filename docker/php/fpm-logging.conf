; PHP-FPM のログ設定（ログ・監視設計書 3章）。公式イメージの docker.conf より後に読ませるため
; zz- で始まる名前で /usr/local/etc/php-fpm.d/ に置く（ローカル・本番共通）。

[global]
; Laravel のログは stderr に JSON 1行で出し、PHP-FPM 経由で Docker に渡る。
; 公式イメージの既定（8192文字）では、スタックトレース付きのエラーなど長い行が
; 途中で2行に分かれ、JSON として読めなくなる（実測で確認）。上限を広げる。
log_limit = 65536

[www]
; PHP-FPM 自身のアクセスログ（"GET /index.php" 200 だけの行）は出さない。
; アクセスログは nginx と Laravel が出しており、重複してログ量が増えるだけのため。
access.log = /dev/null
