# アクセスログ（ログ・監視設計書 3章・6章）。
# 既定の形式は URL をクエリ文字列ごと記録するため、検索語（要望者名が入りうる）や
# 署名付きURLの署名がログに残る。クエリ文字列を除いたパスだけを JSON 1行で出す。
# request_id は Laravel が返す X-Request-Id ヘッダの値で、アプリのログと突き合わせられる。
# 接続元の IP アドレスは記録しない（アプリのログと同じ方針）。
map $request_uri $path_without_query {
    "~^(?<p>[^?]*)" $p;
}

# ALB のヘルスチェック（30秒ごと）は記録しない。location で access_log off にしても
# index.php への内部転送先で記録されてしまうため、記録するかどうかを URL で決める。
map $path_without_query $access_loggable {
    /health 0;
    /up     0;
    default 1;
}

log_format civil_json escape=json
    '{"source":"nginx",'
    '"time":"$time_iso8601",'
    '"method":"$request_method",'
    '"path":"$path_without_query",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"duration_s":$request_time,'
    '"request_id":"$upstream_http_x_request_id"}';

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # 応答ヘッダーやエラー画面に nginx の版を出さない（Server: nginx だけになる）。
    # 外から版が分かると、その版の脆弱性を狙う手がかりになるため（#126）。
    server_tokens off;

    access_log /var/log/nginx/access.log civil_json if=$access_loggable;

    # 現場写真のアップロード（1ファイル5MB × 最大5枚）を通すため。既定の1MBでは
    # 写真1枚でも 413 になる。PHP 側の post_max_size（uploads.ini）と揃える。
    client_max_body_size 30m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # .env 等の隠しファイルへの直接アクセスを拒否（.well-known は除く）
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
