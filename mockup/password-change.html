<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>パスワード変更 | CivilTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="mock-banner">モックアップ（表示イメージ確認用・実データではありません）</div>
<div class="login-wrap">
  <div class="login-card">
    <h1>パスワード変更</h1>

    <!-- サブタイトルは2パターン。初期パスワードのままログインした場合（強制変更）は
         下の「初回強制変更時」の文言になり、それ以外は通常の文言になる。 -->
    <div class="subtitle">現在のパスワードを入力のうえ<br>新しいパスワードを設定してください</div>
    <div class="subtitle">［初回強制変更時の表示］初期パスワードのままログインしています。<br>続けるには新しいパスワードを設定してください。</div>

    <!-- 変更に成功するとトップ画面へ遷移し、そちらで「パスワードを変更しました。」が
         表示される（この画面に残る成功表示は、再表示された場合に備えたもの）。 -->
    <div class="alert alert-success">［成功時の表示例］パスワードを変更しました。</div>
    <!-- 入力エラーの場合（実装は最初のエラー1件のみを表示する）。 -->
    <div class="alert alert-danger">［エラー時の表示例］現在のパスワードが正しくありません。</div>

    <form>
      <div class="field">
        <label for="current-password">現在のパスワード（初回ログイン時は初期パスワード）</label>
        <input type="password" id="current-password" placeholder="現在のパスワードを入力">
      </div>
      <div class="field">
        <label for="new-password">新しいパスワード</label>
        <input type="password" id="new-password" placeholder="8文字以上の新しいパスワード">
      </div>
      <div class="field">
        <label for="new-password-confirm">新しいパスワード（確認）</label>
        <input type="password" id="new-password-confirm" placeholder="確認のためもう一度入力">
      </div>
      <button type="button" class="btn btn-primary">変更する</button>
    </form>
    <div class="login-footer">
      <!-- ログアウトはPOSTで行うため、実装はリンクではなくリンク風ボタン（.btn-link）。 -->
      <button type="button" class="btn-link">ログアウト</button>
    </div>
  </div>
</div>
</body>
</html>
