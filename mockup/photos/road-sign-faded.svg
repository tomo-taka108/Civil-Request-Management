<?xml version="1.0" encoding="UTF-8"?>
<!-- サンプル画像（標識の退色）。実写真ではないSVGプレースホルダ。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="標識の退色（サンプル画像）">
  <rect width="320" height="240" fill="#b9d3e8"/>
  <!-- 背景の樹木と地面 -->
  <circle cx="54" cy="150" r="42" fill="#8fae7e"/>
  <circle cx="268" cy="160" r="36" fill="#8fae7e"/>
  <rect y="186" width="320" height="54" fill="#7f8a79"/>
  <!-- 支柱 -->
  <rect x="152" y="96" width="9" height="96" fill="#9aa3ad"/>
  <!-- 退色した円形標識 -->
  <circle cx="156" cy="80" r="46" fill="#d8d2c4"/>
  <circle cx="156" cy="80" r="46" fill="none" stroke="#b9a9a2" stroke-width="7"/>
  <rect x="124" y="74" width="64" height="12" rx="3" fill="#c9bfb4"/>
  <rect x="0" y="0" width="320" height="26" fill="#2b3040" opacity="0.72"/>
  <text x="10" y="18" font-family="sans-serif" font-size="13" fill="#ffffff">標識の退色（サンプル画像）</text>
</svg>
