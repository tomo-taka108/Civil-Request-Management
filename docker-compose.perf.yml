# 負荷試験（k6）専用の環境（パフォーマンステスト設計書 2章）。
#
# 本番と同じイメージ（Dockerfile.prod）で nginx・php を動かし、試験専用の MySQL を足す。
# 開発用の環境（docker-compose.yml、ポート 8081）とはプロジェクト名・ネットワーク・DB を
# 分けているので、試験で開発用のデータが汚れることはない。
#
# 通常は perf/run-perf.sh から起動・停止する（APP_KEY の生成・データ投入・後片付けを含む）。
#   ./perf/run-perf.sh
#
# 本番との違い（数値の読み方は設計書 0章）:
#   - DB は RDS ではなく同じ PC 上の MySQL（ネットワークの往復が無いぶん速く出る）
#   - HTTPS ではないため、セッション Cookie の Secure 属性を外す
#   - 写真の保存先は S3 ではなくローカル（試験データに写真は含めない）
#   - ログは CloudWatch ではなく Docker 既定の保存先に出す（出力の量・形式は本番と同じ）
name: civil-perf

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
    ports:
      - "8082:80"
    depends_on:
      - php
    networks:
      - perf-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    environment:
      APP_NAME: "Civil Track"
      APP_ENV: production
      # 試験のたびに perf/run-perf.sh が使い捨ての値を作って渡す（リポジトリには置かない）。
      APP_KEY: ${PERF_APP_KEY:-}
      APP_DEBUG: "false"
      APP_TIMEZONE: Asia/Tokyo
      APP_URL: http://localhost:8082
      APP_LOCALE: ja
      LOG_CHANNEL: stderr
      LOG_STDERR_FORMATTER: Monolog\Formatter\JsonFormatter
      LOG_DEPRECATIONS_CHANNEL: "null"
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: civil_request_perf
      DB_USERNAME: perf
      DB_PASSWORD: perf
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_ja_0900_as_cs
      SESSION_DRIVER: file
      SESSION_LIFETIME: "120"
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      PHOTO_DISK: local
      MAIL_MAILER: log
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - perf-network

  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_ja_0900_as_cs
    environment:
      # 外部に公開しない使い捨ての DB のため、固定の値でよい。
      MYSQL_ROOT_PASSWORD: perf
      MYSQL_DATABASE: civil_request_perf
      MYSQL_USER: perf
      MYSQL_PASSWORD: perf
    # データはメモリ上に置き、止めると消える（毎回まっさらな状態から試験する）。
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      # 初回の初期化中は外部接続なしの一時サーバーが動くため、TCP でつなげるかで判定する
      # （mysqladmin ping は初期化中にも成功してしまい、php が先に接続して失敗する）。
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-uperf", "-pperf", "-e", "SELECT 1", "civil_request_perf"]
      interval: 3s
      timeout: 5s
      retries: 40
    networks:
      - perf-network
    # ポートは公開しない（php からのみ使う）。

networks:
  perf-network:
    driver: bridge
