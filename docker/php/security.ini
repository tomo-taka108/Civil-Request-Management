; セキュリティのための PHP 設定（開発用・本番用で共用）。

; アップロードの進み具合をセッションに記録する機能を止める。
; このアプリは使っていない機能で、止めても画面・写真のアップロードに影響はない。
; 2026-10 の PHP の脆弱性（PHP2Shell。CVE-2026-109619、追加の CVE-2026-115560）は
; この機能を通り道にしていた。根本対策は PHP を修正版（8.3.36 以上）にすることで、
; これは念のための二重の守り（docs/security-advisories.md）。
session.upload_progress.enabled = 0
